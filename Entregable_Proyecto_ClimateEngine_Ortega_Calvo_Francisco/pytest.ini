[pytest]
# La libreria importnb (usada solo por dashboard/app.py para reutilizar
# config.ipynb) registra un plugin de pytest incompatible con versiones
# recientes de pytest (choca con el hook pytest_collect_file). Se
# desactiva explicitamente: los tests de este proyecto no importan
# notebooks via importnb (ver tests/notebook_test_utils.py), asi que no
# se pierde ninguna funcionalidad.
addopts = -p no:importnb
testpaths = tests
