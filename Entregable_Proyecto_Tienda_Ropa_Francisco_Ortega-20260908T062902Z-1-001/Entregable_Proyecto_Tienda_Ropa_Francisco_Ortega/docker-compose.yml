networks:
  fashionshop_net:
    driver: bridge

volumes:
  fashionshop_pgdata:

services:
  postgres_fashionshop:
    image: postgres:16
    container_name: postgres_fashionshop_dw
    restart: unless-stopped
    environment:
      POSTGRES_DB: db_fashionshop_dw
      POSTGRES_USER: admin_etl
      POSTGRES_PASSWORD: Password123!
    ports:
      - "5432:5432"
    volumes:
      # Volumen nombrado -> los datos persisten aunque se recree el contenedor.
      - fashionshop_pgdata:/var/lib/postgresql/data
      # El DDL se monta en el directorio de inicialización oficial de la imagen
      # oficial de Postgres: se ejecuta automáticamente la PRIMERA vez que se
      # crea el volumen de datos (así "docker compose up" ya deja el esquema
      # destino listo, sin pasos manuales adicionales).
      - ./sql/ddl_destino_postgresql.sql:/docker-entrypoint-initdb.d/01_ddl_destino_postgresql.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin_etl -d db_fashionshop_dw"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fashionshop_net

# Uso:
#   docker compose up -d          -> levanta PostgreSQL en localhost:5432
#   docker compose down           -> lo detiene (los datos se conservan en el volumen)
#   docker compose down -v        -> lo detiene y BORRA también los datos (reinicio limpio)
#
# El notebook (src/ETL_Tienda_Ropa_FranciscoOrtega.ipynb) se conecta por defecto
# a localhost:5432 con estas mismas credenciales (parametrizadas vía variables
# de entorno POSTGRES_HOST / POSTGRES_PORT / POSTGRES_DB / POSTGRES_USER /
# POSTGRES_PASSWORD, con estos valores como valor por defecto).
